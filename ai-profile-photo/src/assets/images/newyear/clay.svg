<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <filter id="clayFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="260" fill="url(#clayGrad)"/>

  <!-- 클레이 캐릭터 (둥근 느낌) -->
  <!-- 몸통 -->
  <ellipse cx="100" cy="150" rx="45" ry="55" fill="#FFB74D" filter="url(#clayFilter)"/>
  <ellipse cx="100" cy="155" rx="40" ry="45" fill="#FFCC80"/>

  <!-- 머리 -->
  <circle cx="100" cy="85" r="40" fill="#FFB74D"/>
  <circle cx="100" cy="82" r="36" fill="#FFCC80"/>

  <!-- 볼 터치 -->
  <circle cx="75" cy="90" r="10" fill="#FFAB91" opacity="0.6"/>
  <circle cx="125" cy="90" r="10" fill="#FFAB91" opacity="0.6"/>

  <!-- 눈 (클레이 스타일 - 단순하고 귀여운) -->
  <circle cx="85" cy="80" r="8" fill="#FFF"/>
  <circle cx="115" cy="80" r="8" fill="#FFF"/>
  <circle cx="85" cy="80" r="4" fill="#37474F"/>
  <circle cx="115" cy="80" r="4" fill="#37474F"/>
  <circle cx="87" cy="78" r="2" fill="#FFF"/>
  <circle cx="117" cy="78" r="2" fill="#FFF"/>

  <!-- 코 -->
  <ellipse cx="100" cy="95" rx="5" ry="4" fill="#FF8A65"/>

  <!-- 입 -->
  <path d="M 92 105 Q 100 112 108 105" stroke="#795548" stroke-width="2" fill="none"/>

  <!-- 귀 -->
  <circle cx="65" cy="60" r="12" fill="#FFB74D"/>
  <circle cx="65" cy="60" r="8" fill="#FFAB91"/>
  <circle cx="135" cy="60" r="12" fill="#FFB74D"/>
  <circle cx="135" cy="60" r="8" fill="#FFAB91"/>

  <!-- 새해 장식 (클레이 느낌) -->
  <circle cx="55" cy="180" r="8" fill="#EF5350"/>
  <circle cx="145" cy="180" r="8" fill="#EF5350"/>
  <circle cx="35" cy="140" r="6" fill="#FFD54F"/>
  <circle cx="165" cy="140" r="6" fill="#FFD54F"/>

  <!-- 리본/목도리 -->
  <ellipse cx="100" cy="125" rx="25" ry="8" fill="#E53935"/>
  <ellipse cx="100" cy="125" rx="20" ry="5" fill="#EF5350"/>

  <!-- 클레이 질감 점들 -->
  <circle cx="80" cy="150" r="2" fill="#FFE0B2" opacity="0.8"/>
  <circle cx="120" cy="145" r="2" fill="#FFE0B2" opacity="0.8"/>
  <circle cx="95" cy="170" r="1.5" fill="#FFE0B2" opacity="0.8"/>

  <!-- Text -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="600">3D 클레이/점토</text>
</svg>
