<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <linearGradient id="animeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB3D9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="260" fill="url(#animeGrad)"/>

  <!-- Anime style stars -->
  <polygon points="30,40 35,50 45,50 37,57 40,67 30,60 20,67 23,57 15,50 25,50" fill="#FF69B4"/>
  <polygon points="170,160 173,166 180,166 175,170 177,177 170,173 163,177 165,170 160,166 167,166" fill="#FF1493"/>

  <!-- Anime character silhouette -->
  <circle cx="100" cy="95" r="28" fill="#FF69B4"/>
  <ellipse cx="92" cy="92" rx="5" ry="8" fill="#FFF"/>
  <ellipse cx="108" cy="92" rx="5" ry="8" fill="#FFF"/>
  <circle cx="92" cy="93" r="3" fill="#000"/>
  <circle cx="108" cy="93" r="3" fill="#000"/>

  <!-- Body -->
  <path d="M 70 125 Q 100 130 130 125 L 130 200 Q 100 205 70 200 Z" fill="#FF1493"/>

  <!-- Sparkles -->
  <circle cx="55" cy="120" r="4" fill="#FFD700"/>
  <circle cx="145" cy="80" r="5" fill="#FFD700"/>
  <circle cx="140" cy="200" r="4" fill="#FFD700"/>

  <!-- Text -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="14" fill="#C71585" text-anchor="middle" font-weight="600">일본 만화풍</text>
</svg>
