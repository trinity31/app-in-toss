<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <linearGradient id="chineseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="goldGrad">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="260" fill="url(#chineseGrad)"/>

  <!-- Decorative gold frame -->
  <rect x="15" y="30" width="170" height="170" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="8"/>
  <circle cx="30" cy="45" r="8" fill="url(#goldGrad)"/>
  <circle cx="170" cy="45" r="8" fill="url(#goldGrad)"/>
  <circle cx="30" cy="185" r="8" fill="url(#goldGrad)"/>
  <circle cx="170" cy="185" r="8" fill="url(#goldGrad)"/>

  <!-- Traditional Chinese figure -->
  <circle cx="100" cy="95" r="25" fill="#DC143C"/>
  <path d="M 75 120 Q 100 125 125 120 L 125 180 Q 100 185 75 180 Z" fill="#8B0000"/>

  <!-- Gold decorative elements -->
  <path d="M 60 110 Q 65 100 70 110" fill="none" stroke="#FFD700" stroke-width="2"/>
  <path d="M 130 110 Q 135 100 140 110" fill="none" stroke="#FFD700" stroke-width="2"/>

  <!-- Traditional patterns -->
  <circle cx="50" cy="115" r="5" fill="#FFD700" opacity="0.8"/>
  <circle cx="150" cy="115" r="5" fill="#FFD700" opacity="0.8"/>
  <circle cx="100" cy="160" r="6" fill="#FFD700" opacity="0.8"/>

  <!-- Text -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="14" fill="#8B0000" text-anchor="middle" font-weight="600">화려한 중국풍</text>
</svg>
