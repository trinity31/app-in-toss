<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <linearGradient id="minhwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6C8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background - 한지 느낌 -->
  <rect width="200" height="260" fill="url(#minhwaGrad)"/>

  <!-- 소나무 (Pine tree) -->
  <path d="M 40 180 Q 35 160 40 140 Q 50 150 60 145 Q 55 130 45 120 Q 55 125 65 115 Q 55 100 50 80" stroke="#2D5016" stroke-width="3" fill="none"/>
  <ellipse cx="50" cy="85" rx="20" ry="12" fill="#3D7A1E" opacity="0.8"/>
  <ellipse cx="60" cy="110" rx="18" ry="10" fill="#4A9023" opacity="0.8"/>
  <ellipse cx="55" cy="135" rx="22" ry="12" fill="#3D7A1E" opacity="0.8"/>

  <!-- 호랑이 (Tiger) - 민화 스타일 -->
  <ellipse cx="115" cy="130" rx="35" ry="45" fill="#E8A838"/>
  <ellipse cx="115" cy="90" rx="25" ry="22" fill="#E8A838"/>
  <!-- 호랑이 줄무늬 -->
  <path d="M 100 80 Q 115 75 130 80" stroke="#2D1810" stroke-width="3" fill="none"/>
  <path d="M 95 95 Q 115 90 135 95" stroke="#2D1810" stroke-width="3" fill="none"/>
  <path d="M 90 115 Q 115 110 140 115" stroke="#2D1810" stroke-width="2" fill="none"/>
  <path d="M 85 135 Q 115 130 145 135" stroke="#2D1810" stroke-width="2" fill="none"/>
  <!-- 호랑이 얼굴 -->
  <circle cx="105" cy="85" r="5" fill="#FFF"/>
  <circle cx="125" cy="85" r="5" fill="#FFF"/>
  <circle cx="105" cy="85" r="2" fill="#000"/>
  <circle cx="125" cy="85" r="2" fill="#000"/>
  <ellipse cx="115" cy="95" rx="4" ry="3" fill="#FF6B6B"/>

  <!-- 까치 (Magpie) -->
  <ellipse cx="160" cy="60" rx="12" ry="8" fill="#1A1A2E"/>
  <circle cx="165" cy="55" r="6" fill="#1A1A2E"/>
  <polygon points="175,55 185,52 175,58" fill="#FFB347"/>
  <ellipse cx="155" cy="70" rx="4" ry="8" fill="#FFF"/>

  <!-- 매화 (Plum blossoms) -->
  <circle cx="170" cy="120" r="8" fill="#FF9EAA"/>
  <circle cx="172" cy="120" r="2" fill="#FFD700"/>
  <circle cx="155" cy="140" r="6" fill="#FFB6C1"/>
  <circle cx="156" cy="140" r="1.5" fill="#FFD700"/>
  <circle cx="180" cy="150" r="7" fill="#FF9EAA"/>
  <circle cx="181" cy="150" r="2" fill="#FFD700"/>

  <!-- 복 글자 장식 -->
  <circle cx="35" cy="200" r="15" fill="#C41E3A" opacity="0.9"/>
  <text x="35" y="206" font-family="serif" font-size="16" fill="#FFD700" text-anchor="middle" font-weight="bold">福</text>

  <!-- Text -->
  <text x="100" y="245" font-family="Arial, sans-serif" font-size="14" fill="#5D4037" text-anchor="middle" font-weight="600">한국 전통 민화</text>
</svg>
