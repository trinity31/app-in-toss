<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--semantic-background-default);font-family:var(--tds-font-body);box-sizing:border-box}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:10px}.nm{font:400 10px/1.2 var(--tds-font-body);color:var(--semantic-text-quaternary)}.vl{font:400 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--semantic-text-quaternary);opacity:.75}.grid{display:grid;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(10,1fr)"><div class="sw"><div class="chip" style="background:var(--base-green-green-50)"></div><div class="nm">50</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-100)"></div><div class="nm">100</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-200)"></div><div class="nm">200</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-300)"></div><div class="nm">300</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-400)"></div><div class="nm">400</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-500)"></div><div class="nm">500</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-600)"></div><div class="nm">600</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-700)"></div><div class="nm">700</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-800)"></div><div class="nm">800</div></div><div class="sw"><div class="chip" style="background:var(--base-green-green-900)"></div><div class="nm">900</div></div></div></body></html>
