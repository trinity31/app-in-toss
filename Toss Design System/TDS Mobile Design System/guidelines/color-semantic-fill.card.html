<!-- @dsCard group="Colors" viewport="700x180" name="Semantic — fill" subtitle="Every fill has a 16 %-alpha weak twin." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--semantic-background-default);font-family:var(--tds-font-body);box-sizing:border-box}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:10px}.nm{font:400 10px/1.2 var(--tds-font-body);color:var(--semantic-text-quaternary)}.vl{font:400 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--semantic-text-quaternary);opacity:.75}.grid{display:grid;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--semantic-fill-brand)"></div><div class="chip" style="height:32px;background:var(--semantic-fill-brand-weak)"></div><div class="nm">brand / weak</div></div><div class="sw"><div class="chip" style="background:var(--semantic-fill-neutral)"></div><div class="chip" style="height:32px;background:var(--semantic-fill-neutral-weak)"></div><div class="nm">neutral / weak</div></div><div class="sw"><div class="chip" style="background:var(--semantic-fill-danger)"></div><div class="chip" style="height:32px;background:var(--semantic-fill-danger-weak)"></div><div class="nm">danger / weak</div></div><div class="sw"><div class="chip" style="background:var(--semantic-fill-success)"></div><div class="chip" style="height:32px;background:var(--semantic-fill-success-weak)"></div><div class="nm">success / weak</div></div><div class="sw"><div class="chip" style="background:var(--semantic-fill-warning)"></div><div class="chip" style="height:32px;background:var(--semantic-fill-warning-weak)"></div><div class="nm">warning / weak</div></div>
</div></body></html>
