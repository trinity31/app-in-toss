<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--semantic-background-default);font-family:var(--tds-font-body);box-sizing:border-box}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:10px}.nm{font:400 10px/1.2 var(--tds-font-body);color:var(--semantic-text-quaternary)}.vl{font:400 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--semantic-text-quaternary);opacity:.75}.grid{display:grid;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--semantic-background-default);box-shadow:inset 0 0 0 1px rgba(0,27,55,.1)"></div><div class="nm">background default</div></div><div class="sw"><div class="chip" style="background:var(--semantic-background-lower);box-shadow:inset 0 0 0 1px rgba(0,27,55,.1)"></div><div class="nm">background lower</div></div><div class="sw"><div class="chip" style="background:var(--semantic-background-floated);box-shadow:inset 0 0 0 1px rgba(0,27,55,.1)"></div><div class="nm">background floated</div></div><div class="sw"><div class="chip" style="background:var(--semantic-background-dim);box-shadow:inset 0 0 0 1px rgba(0,27,55,.1)"></div><div class="nm">background dim</div></div><div class="sw"><div class="chip" style="background:var(--semantic-border-default);box-shadow:inset 0 0 0 1px rgba(0,27,55,.1)"></div><div class="nm">border default</div></div>
</div></body></html>
