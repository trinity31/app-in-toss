<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--semantic-background-default);font-family:var(--tds-font-body);box-sizing:border-box}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:10px}.nm{font:400 10px/1.2 var(--tds-font-body);color:var(--semantic-text-quaternary)}.vl{font:400 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--semantic-text-quaternary);opacity:.75}.grid{display:grid;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(10,1fr)"><div class="sw"><div class="chip" style="background:var(--base-yellow-yellow-100)"></div><div class="nm">Y100</div></div><div class="sw"><div class="chip" style="background:var(--base-yellow-yellow-300)"></div><div class="nm">Y300</div></div><div class="sw"><div class="chip" style="background:var(--base-yellow-yellow-500)"></div><div class="nm">Y500</div></div><div class="sw"><div class="chip" style="background:var(--base-yellow-yellow-700)"></div><div class="nm">Y700</div></div><div class="sw"><div class="chip" style="background:var(--base-yellow-yellow-900)"></div><div class="nm">Y900</div></div><div class="sw"><div class="chip" style="background:var(--base-teal-teal-100)"></div><div class="nm">T100</div></div><div class="sw"><div class="chip" style="background:var(--base-teal-teal-300)"></div><div class="nm">T300</div></div><div class="sw"><div class="chip" style="background:var(--base-teal-teal-500)"></div><div class="nm">T500</div></div><div class="sw"><div class="chip" style="background:var(--base-teal-teal-700)"></div><div class="nm">T700</div></div><div class="sw"><div class="chip" style="background:var(--base-teal-teal-900)"></div><div class="nm">T900</div></div></div></body></html>
